global:
  scrape_interval: 5s

scrape_configs:
  - job_name: virtual-lab
    scrape_native_histograms: true
    static_configs:
      - targets: ['127.0.0.1:9091']

  - job_name: guest
    metrics_path: /guest/metrics
    static_configs:
      - targets: ['127.0.0.1:9091']
        labels:
          vm_id: lab-01
